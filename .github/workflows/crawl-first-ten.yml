name: Crawl first ten qualified leads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl-first-ten.yml"
      - "crawl.py"
      - "targets.json"
      - "requirements-ci.txt"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Crawl4AI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Crawl first ten leads
        run: python crawl.py

      - name: Upload crawl results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-ten-crawl-results
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
